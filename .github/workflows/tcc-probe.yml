# Throwaway diagnostic. Establishes what a macos-26 runner allows before the
# real integration tier is built on top of it, so we learn everything in one
# run instead of one unknown per push. Deleted once its questions are answered.
#
# Pre-granting recording permission to our own signed app is the approach the
# runner-images maintainers point people at (actions/runner-images#9529): the
# images deliberately allow runtime TCC updates because a hosted runner has no
# human to click the consent dialog.
name: TCC probe

on:
  workflow_dispatch:
  push:
    branches: [ci/hardware-tiers]

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Machine facts
        continue-on-error: true
        run: |
          sw_vers
          xcodebuild -version
          csrutil status || true
          whoami
          sudo -n true && echo "passwordless sudo: yes" || echo "passwordless sudo: NO"

      - name: Audio devices
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType || true

      - name: TCC databases - schema and contents
        continue-on-error: true
        run: |
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          USR="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          for db in "$SYS" "$USR"; do
            echo "=============================================="
            echo "DB: $db"
            if [ ! -f "$db" ]; then echo "  (does not exist)"; continue; fi
            echo "--- readable unprivileged? ---"
            sqlite3 "$db" "SELECT count(*) FROM access;" 2>&1 | head -2
            echo "--- with sudo ---"
            sudo sqlite3 "$db" "SELECT count(*) FROM access;" 2>&1 | head -2
            echo "--- columns ---"
            sudo sqlite3 "$db" "SELECT name FROM pragma_table_info('access');" 2>&1 | tr '\n' ' '
            echo ""
            echo "--- services present ---"
            sudo sqlite3 "$db" "SELECT DISTINCT service FROM access;" 2>&1 | head -40
          done

      - name: Is the system TCC database writable
        continue-on-error: true
        run: |
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo sqlite3 "$SYS" "BEGIN; CREATE TABLE _probe_delete_me(x); DROP TABLE _probe_delete_me; COMMIT;" 2>&1 \
            && echo "SYSTEM TCC.db IS WRITABLE" || echo "SYSTEM TCC.db WRITE BLOCKED"

      - name: Import Developer ID certificate
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_P12_BASE64:-}" ]; then echo "NO CERT SECRET"; exit 1; fi
          KC=build.keychain
          KCP="$(uuidgen)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          printf '%s' "$APPLE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$APPLE_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/id.p12"
          security find-identity -v -p codesigning

      - name: Build and sign the app bundle
        continue-on-error: true
        run: |
          set -euo pipefail
          make bundle
          codesign -dvvv build/Blackbox.app 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier|flags' || true
          echo "--- designated requirement ---"
          codesign -d -r- build/Blackbox.app 2>&1 | tail -1

      - name: Seed recording permission for the signed bundle
        continue-on-error: true
        run: |
          set -x
          APP="build/Blackbox.app"
          REQ="$(codesign -d -r- "$APP" 2>/dev/null | sed -n 's/^designated => //p')"
          echo "$REQ" | csreq -r- -b "$RUNNER_TEMP/req.bin"
          HEX="$(xxd -p "$RUNNER_TEMP/req.bin" | tr -d '\n')"
          echo "csreq hex length: ${#HEX}"
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          USR="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          NOW="$(date +%s)"
          # Column count decides the row shape; it has grown across releases, so
          # report it rather than assuming Sonoma's layout still holds on 26.
          NCOLS="$(sudo sqlite3 "$SYS" "SELECT count(*) FROM pragma_table_info('access');")"
          echo "system access column count: $NCOLS"
          sudo sqlite3 "$SYS" \
            "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,last_modified) \
             VALUES('kTCCServiceScreenCapture','com.tenequm.Blackbox',0,2,4,1,X'$HEX',$NOW);" 2>&1 \
            || echo "named-column insert into SYSTEM failed"
          sudo sqlite3 "$USR" \
            "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,last_modified) \
             VALUES('kTCCServiceMicrophone','com.tenequm.Blackbox',0,2,4,1,X'$HEX',$NOW);" 2>&1 \
            || echo "named-column insert into USER failed"
          echo "--- resulting rows ---"
          sudo sqlite3 "$SYS" "SELECT service,client,auth_value FROM access WHERE client LIKE '%Blackbox%';" 2>&1
          sudo sqlite3 "$USR" "SELECT service,client,auth_value FROM access WHERE client LIKE '%Blackbox%';" 2>&1

      - name: Does the app see the grant
        continue-on-error: true
        run: |
          BLACKBOX_RUN_HARDWARE_SMOKE=1 BLACKBOX_SMOKE_APP_PATH="$PWD/build/Blackbox.app" \
            swift test --disable-xctest --filter idleAppStartsNoCapture 2>&1 | tail -30

      - name: App log
        if: always()
        continue-on-error: true
        run: tail -80 ~/Library/Logs/Blackbox/blackbox.log 2>/dev/null || echo "(no app log)"
