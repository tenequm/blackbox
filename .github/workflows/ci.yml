name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macos-26 is required: Package.swift targets macOS 26.1, so a test binary
    # with that minimum will not launch on macos-15 even though it compiles.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "hash=$(swift --version | head -1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Keyed on toolchain + resolved dependencies only: a per-commit key would
      # write a fresh ~300MB entry every run, and PR caches are scoped to the
      # merge ref, so they would never be reused. PRs read main's cache.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-

      - name: Lint formatting
        run: make format-check

      # --build-tests builds the test bundle in one pass; `make test-ci` then
      # runs with --skip-build. Debug only - the release build is verified on
      # main, not on every PR, since it doubles compile time for the same code.
      - name: Build tests
        run: swift build --build-tests

      - name: Probe - sample the AEC suite where it stalls
        env:
          BLACKBOX_AEC_CPU_ONLY: "1"
        run: |
          set +e
          swift test --disable-xctest --skip-build --filter AECProcessingTests > /tmp/aec.log 2>&1 &
          P=$!
          for i in $(seq 1 9); do sleep 10; kill -0 $P 2>/dev/null || { echo "AEC: exited ~$((i*10))s"; break; }; done
          if kill -0 $P 2>/dev/null; then
            echo "=== AEC STALLED at 90s - full-process sample ==="
            H=$(pgrep -f swiftpm-testing-helper | head -1)
            sample "$H" 3 -mayDie -file /tmp/aec.sample 2>&1 | tail -1
            echo "--- threads doing anything other than idle wait ---"
            # Print every thread's top-of-stack chain, trimmed
            awk '/^    [0-9]+ Thread_/{t=$0} /AEC|DTLN|MLModel|CoreML|Espresso|ANE|MPS|Metal|AVAsset|swift_task|semaphore|ulock|dispatch_group|pthread_cond/{print t; print "      "$0}' /tmp/aec.sample | awk '!seen[$0]++' | head -120
            kill -9 $P; pkill -9 -f swiftpm-testing-helper
          fi
          echo "=== last log lines ==="; tail -5 /tmp/aec.log
          true

      - name: Test
        # The runner has no Neural Engine and CoreML stalls on the ANE path;
        # pin the AEC model to CPU so the suite runs for real instead of
        # being skipped.
        env:
          BLACKBOX_AEC_CPU_ONLY: "1"
        run: make test

      - name: Release build
        if: github.ref == 'refs/heads/main'
        run: make build
