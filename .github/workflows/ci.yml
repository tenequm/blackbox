name: CI

# DISABLED: `swift test` hangs on the runner (>30 min, no output) while it takes
# 3s locally. Dispatch-only until that is understood - see the diagnose job.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    # macos-26 is required: Package.swift targets macOS 26.1, so a test binary
    # with that minimum will not launch on macos-15.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain and environment
        run: |
          swift --version
          sw_vers
          echo "--- audio devices ---"
          system_profiler SPAudioDataType 2>&1 | head -30 || true

      - name: Build tests
        run: swift build --build-tests

      # Run the suite detached, sample the stack while it is still alive, then
      # kill it. A `sample` of the hung process is the only thing that says
      # *where* it blocks; CI stdout is a pipe, so Swift Testing's output is
      # block-buffered and invisible until the process exits.
      - name: Run tests with stack sampling on hang
        run: |
          set +e
          swift test --disable-xctest --skip-build -v > test.log 2>&1 &
          SWIFTPID=$!
          for i in $(seq 1 24); do
            sleep 10
            if ! kill -0 $SWIFTPID 2>/dev/null; then echo "exited after ~$((i*10))s"; break; fi
          done
          if kill -0 $SWIFTPID 2>/dev/null; then
            echo "=== STILL RUNNING after 240s - sampling ==="
            ps -Axo pid,etime,command | grep -i blackbox | grep -v grep
            for p in $(pgrep -f "BlackboxPackageTests|xctest|swift-testing"); do
              echo "=== sample $p ==="
              sample "$p" 5 -mayDie 2>&1 | head -120
            done
            kill -9 $SWIFTPID 2>/dev/null
            pkill -9 -f BlackboxPackageTests 2>/dev/null
          fi
          echo "=== test.log (first 200 lines) ==="
          head -200 test.log
          echo "=== test.log (last 100 lines) ==="
          tail -100 test.log
